      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bgChacha)"/>
  <!-- Face -->
  <circle cx="100" cy="95" r="50" fill="#ffd1a4"/>
  <!-- Hair -->
  <path d="M55,90 Q50,45 100,45 Q150,45 145,90 Q120,60 100,60 Q80,60 55,90 Z" fill="#2d2340"/>
  <!-- Cool Sunglasses -->
  <rect x="68" y="80" width="28" height="20" rx="6" fill="#1e293b"/>
  <rect x="104" y="80" width="28" height="20" rx="6" fill="#1e293b"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="4"/>
  <!-- Moustache -->
  <path d="M85,115 Q100,110 100,118 Q100,110 115,115 Q100,125 85,115 Z" fill="#1e293b"/>
  <!-- Big Smile -->
  <path d="M88,125 Q100,138 112,125" stroke="#e11d48" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Party Hat -->
  <polygon points="100,20 80,60 120,60" fill="#ff4d94"/>
  <circle cx="100" cy="18" r="8" fill="#ffd166"/>
  <line x1="88" y1="35" x2="112" y2="35" stroke="#ffd166" stroke-width="4"/>
  <line x1="85" y1="48" x2="115" y2="48" stroke="#38ef7d" stroke-width="4"/>
  <!-- Text Badge -->
  <rect x="35" y="155" width="130" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
  <text x="100" y="176" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0284c7">🕶️ Rohan Chacha</text>
</svg>

