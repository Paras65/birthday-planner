<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="heroFaceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba86d"/>
    </radialGradient>
    <linearGradient id="heroHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="94" fill="#fef08a" opacity="0.3"/>
  <circle cx="100" cy="100" r="88" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
  <!-- Hair Behind -->
  <circle cx="100" cy="85" r="58" fill="url(#heroHairGrad)"/>
  <!-- Face -->
  <ellipse cx="100" cy="105" rx="46" ry="48" fill="url(#heroFaceGrad)"/>
  <!-- Ears -->
  <circle cx="54" cy="108" r="10" fill="#fba86d"/>
  <circle cx="146" cy="108" r="10" fill="#fba86d"/>
  <!-- Front Hair Fringe -->
  <path d="M56,82 C60,52 90,44 100,44 C120,44 144,52 144,82 C132,68 118,65 100,65 C82,65 68,70 56,82 Z" fill="url(#heroHairGrad)"/>
  <!-- Eyes -->
  <ellipse cx="80" cy="98" rx="7" ry="9" fill="#1e1b4b"/>
  <ellipse cx="120" cy="98" rx="7" ry="9" fill="#1e1b4b"/>
  <circle cx="78" cy="95" r="2.5" fill="#ffffff"/>
  <circle cx="118" cy="95" r="2.5" fill="#ffffff"/>
  <!-- Rosy Cheeks -->
  <circle cx="68" cy="114" r="8" fill="#fb7185" opacity="0.5"/>
  <circle cx="132" cy="114" r="8" fill="#fb7185" opacity="0.5"/>
  <!-- Hero Mask (Golden Star Hero Mask) -->
  <path d="M60,94 Q100,82 140,94 Q146,104 135,108 Q100,98 65,108 Q54,104 60,94 Z" fill="#f59e0b" opacity="0.85"/>
  <!-- Joyful Smile -->
  <path d="M86,122 Q100,138 114,122" stroke="#b91c1c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Star on forehead -->
  <polygon points="100,68 102,74 108,74 103,78 105,84 100,80 95,84 97,78 92,74 98,74" fill="#eab308"/>
</svg>
